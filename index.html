<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17365d"><link rel="manifest" href="manifest.json"><title>현장 업무 매뉴얼</title><style> *{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17365d;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{text-align:center;margin:65px 0 12px;font-size:28px}p{line-height:1.6}button,input,textarea{font:inherit;border:1px solid #ccd5df;border-radius:10px;padding:12px}input,textarea{width:100%;background:white}textarea{min-height:120px}button{cursor:pointer;background:#17365d;color:white;margin:4px 0}button.alt{background:white;color:#17365d}section,article{background:white;border:1px solid #e0e5ec;border-radius:14px;padding:16px;margin:12px 0}small{color:#64748b}nav{display:flex;gap:6px;flex-wrap:wrap}label{display:block;margin:10px 0 4px}#notice{white-space:pre-wrap;color:#9b341c}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.7} [hidden]{display:none!important}</style></head><body><main><header><strong>현장 업무 매뉴얼</strong><button id="logout" hidden>로그아웃</button></header><p id="notice" role="status"></p><div id="app">연결 중…</div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,setPersistence,browserSessionPersistence} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
import {initializeFirestore,memoryLocalCache,doc,collection,getDocFromServer,getDocsFromServer,setDoc,addDoc,updateDoc,deleteDoc,serverTimestamp,onSnapshot} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js';
const config={apiKey:'AIzaSyCrH8W59H26q7P0pPlv91FMscvT10h_dkk',authDomain:'police-manual-73975.firebaseapp.com',projectId:'police-manual-73975',storageBucket:'police-manual-73975.firebasestorage.app',messagingSenderId:'302556436811',appId:'1:302556436811:web:e84c7e836a31ef359a30ce'};
const firebase=initializeApp(config),auth=getAuth(firebase),db=initializeFirestore(firebase,{localCache:memoryLocalCache()});await setPersistence(auth,browserSessionPersistence);
const root=document.querySelector('#app'),notice=document.querySelector('#notice'),logout=document.querySelector('#logout');let user,admin=false,approved=false,manuals=[],stops=[],generation=0,favorites=new Set(),recent=[];
function el(tag,text,parent=root){let e=document.createElement(tag);if(text)e.textContent=text;parent.append(e);return e}function btn(text,fn,parent=root){let e=el('button',text,parent);e.onclick=async()=>{notice.textContent='';try{await fn()}catch(err){notice.textContent='처리 실패: '+(err.code||err.message)}};return e}function field(parent,label,multi=false){el('label',label,parent);return el(multi?'textarea':'input','',parent)}function clear(){root.replaceChildren()}function stop(){stops.forEach(f=>f());stops=[];manuals=[];favorites.clear();recent=[];admin=approved=false;clear()}logout.onclick=()=>signOut(auth);
function login(){clear();el('h1','현장 업무 매뉴얼');el('p','승인된 경찰서 직원만 이용할 수 있습니다.');btn('Google 계정으로 로그인',()=>signInWithPopup(auth,new GoogleAuthProvider()))}
function pending(status){clear();el('h1',status==='pending'?'승인 대기 중':'이용 권한 없음');el('p','관리자에게 문의해 주세요.');btn('권한 다시 확인',()=>refresh())}
function join(){clear();el('h1','이용 권한 신청');let n=field(root,'성명'),d=field(root,'소속 부서');btn('신청',async()=>{if(!n.value.trim()||!d.value.trim())throw Error('성명과 소속을 입력하세요.');await setDoc(doc(db,'users',user.uid),{name:n.value.trim(),department:d.value.trim(),status:'pending',createdAt:serverTimestamp()});await refresh()});el('small','신청 정보는 관리자 승인 목적으로 사용됩니다. 실제 사건정보는 입력하지 마세요.')}
async function refresh(){let g=++generation;stop();if(!user){login();return}el('p','권한 확인 중…');try{let [a,u]=await Promise.all([getDocFromServer(doc(db,'admins',user.uid)),getDocFromServer(doc(db,'users',user.uid))]);if(g!==generation)return;admin=a.exists();approved=u.exists()&&u.data().status==='approved';if(admin||approved){let snap=await getDocsFromServer(collection(db,'manuals'));if(g!==generation)return;manuals=snap.docs.map(d=>({id:d.id,...d.data()}));home()}else if(u.exists())pending(u.data().status);else join();for(let [path,initial] of [['admins',a],['users',u]])stops.push(onSnapshot(doc(db,path,user.uid),{includeMetadataChanges:true},s=>{if(g!==generation||s.metadata.fromCache)return;if(s.exists()!==initial.exists()||s.data()?.status!==initial.data()?.status)refresh()},()=>{if(g===generation){stop();el('p','권한 확인 실패. 다시 로그인하세요.')}}));}catch(e){if(g===generation){stop();el('p','서버 연결 또는 권한 확인 실패');btn('다시 시도',refresh);notice.textContent=e.code||e.message}}}
onAuthStateChanged(auth,u=>{user=u;logout.hidden=!u;refresh()});window.addEventListener('offline',()=>{++generation;stop();el('p','인터넷 연결이 필요합니다.')});window.addEventListener('online',refresh);
const norm=s=>String(s||'').normalize('NFC').toLowerCase().replace(/[^가-힣ㄱ-ㅎㅏ-ㅣa-z0-9]/g,'');const initials='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';const cho=s=>norm(s).split('').map(c=>{let x=c.charCodeAt(0)-44032;return x>=0&&x<11172?initials[Math.floor(x/588)]:c}).join('');function dist(a,b){let r=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let t=[i];for(let j=1;j<=b.length;j++)t[j]=Math.min(t[j-1]+1,r[j]+1,r[j-1]+(a[i-1]===b[j-1]?0:1));r=t}return r[b.length]}
function score(m,q){let n=norm(q),title=norm(m.title),keys=String(m.keywords||'').split(/[,\n]/).map(norm).filter(Boolean),words=q.split(/\s+/).map(norm).filter(x=>x.length>=2);if(!n)return 0;let s=title===n?100:title.includes(n)?65:0;if(/^[ㄱ-ㅎ]+$/.test(n)&&cho(m.title).includes(n))s+=55;for(let k of keys){if(k===n)s+=45;else if(k.length>=2&&n.includes(k))s+=18;else if(n.length>=2&&k.includes(n))s+=12}for(let w of words){if(title.includes(w))s+=12;if(norm(m.summary).includes(w))s+=5;if(norm(m.body).includes(w))s+=2}if(n.length>=3&&n.length<=40&&[title,...keys].some(k=>Math.abs(k.length-n.length)<=2&&dist(k,n)<=Math.min(2,Math.floor(n.length/3))))s+=25;return s}
function home(mode='search'){clear();let nav=el('nav');btn('검색',()=>home(),nav);btn('즐겨찾기',()=>home('fav'),nav);btn('최근 열람',()=>home('recent'),nav);btn('전체',()=>home('all'),nav);btn('오류·등록 요청',report,nav);if(admin)btn('관리자',manage,nav);el('h1','무엇을 찾으시나요?');let q=el('input');q.placeholder='업무명 또는 현장 상황 검색';q.maxLength=150;let out=el('div');function render(){out.replaceChildren();let list=mode==='fav'?manuals.filter(m=>favorites.has(m.id)):mode==='recent'?recent.map(id=>manuals.find(m=>m.id===id)).filter(Boolean):mode==='all'?manuals:manuals.map(m=>({...m,s:score(m,q.value)})).filter(m=>m.s>=10).sort((a,b)=>b.s-a.s);if(!q.value.trim()&&mode==='search'){el('p','업무명이나 상황을 입력하세요. 실제 사건 개인정보는 입력하지 마세요.',out);return}if(!list.length)el('p','관련 매뉴얼이 없습니다.',out);function show(n){out.replaceChildren();for(let m of list.slice(0,n)){let a=el('article','',out);btn(m.title,()=>detail(m.id),a);el('p',m.summary||'',a)}if(list.length>n)btn('더 보기',()=>show(n+10),out)}if(list.length)show(5)}q.oninput=()=>{mode='search';render()};render();el('small','공개 법령 기반 참고자료 · 최신 법령 및 공식 지침 확인 필요')}
async function detail(id){let snap=await getDocFromServer(doc(db,'manuals',id));if(!snap.exists())return home();let m=snap.data();recent=[id,...recent.filter(x=>x!==id)].slice(0,30);clear();btn('← 검색',()=>home());el('h2',m.title);btn(favorites.has(id)?'즐겨찾기 해제':'즐겨찾기 추가',()=>{favorites.has(id)?favorites.delete(id):favorites.add(id);return detail(id)});el('h3','핵심 요약');el('p',m.summary);el('h3','상세 내용');el('pre',m.body);el('h3','출처');el('pre',m.source||'미등록');el('small','최종 수정: '+(m.updatedAt?.toDate().toLocaleDateString('ko-KR')||'미등록'))}
function report(){clear();btn('← 검색',()=>home());let t=field(root,'오류 또는 등록 요청 (개인정보 제외)',true);btn('전송',async()=>{await addDoc(collection(db,'reports'),{uid:user.uid,message:t.value.trim(),createdAt:serverTimestamp()});home();notice.textContent='등록되었습니다.'})}
async function manage(){if(!admin)return;clear();btn('← 검색',()=>home());el('h2','관리자');btn('새 매뉴얼',()=>edit());btn('회원 관리',members);btn('오류신고 확인',reports);for(let m of manuals){let a=el('article');el('strong',m.title,a);btn('수정',()=>edit(m),a);btn('삭제',async()=>{if(confirm('삭제하시겠습니까?')){await deleteDoc(doc(db,'manuals',m.id));await refresh();manage()}},a)}}
function edit(m={}){clear();btn('← 관리자',manage);let fields={};for(let [k,l,multi] of [['title','제목'],['category','내부 분류'],['keywords','유사어 (쉼표로 구분)',true],['summary','핵심 요약',true],['body','상세 내용',true],['source','공개 출처',true]]){fields[k]=field(root,l,multi);fields[k].value=m[k]||''}btn('저장',async()=>{let data=Object.fromEntries(Object.entries(fields).map(([k,v])=>[k,v.value.trim()]));if(!data.title||!data.summary||!data.source)throw Error('제목, 요약, 출처를 입력하세요.');data.updatedAt=serverTimestamp();if(m.id)await updateDoc(doc(db,'manuals',m.id),data);else await addDoc(collection(db,'manuals'),data);await refresh();manage()})}
async function members(){clear();btn('← 관리자',manage);el('h2','회원 관리');let s=await getDocsFromServer(collection(db,'users'));for(let d of s.docs){let a=el('article'),u=d.data();el('p',`${u.name} · ${u.department} · ${u.status}`,a);for(let [label,status] of [['승인','approved'],['거절','rejected'],['권한 회수','revoked']])btn(label,async()=>{if(confirm(label+' 처리하시겠습니까?')){await updateDoc(d.ref,{status});members()}},a)}}async function reports(){clear();btn('← 관리자',manage);let s=await getDocsFromServer(collection(db,'reports'));for(let d of s.docs){let a=el('article');el('p',d.data().message,a);btn('삭제',async()=>{if(confirm('삭제하시겠습니까?')){await deleteDoc(d.ref);reports()}},a)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
