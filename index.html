<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17365d"><link rel="manifest" href="manifest.json"><title>현장 업무 매뉴얼</title><style>*{box-sizing:border-box} :root{color-scheme:light dark;--bg:#f3f6fa;--card:#fff;--ink:#17365d;--muted:#526579;--line:#dbe3ec;--warn:#fff4e4;--warning:#854000} @media(prefers-color-scheme:dark){:root{--bg:#101722;--card:#1b2635;--ink:#e3edf9;--muted:#aebed0;--line:#39495c;--warn:#392b1d;--warning:#ffd29a}} body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:8px;justify-content:space-between;background:#17365d;color:white;padding:12px;border-radius:12px}header small{color:#d5e2f3}h1{font-size:22px;margin:16px 0 8px}h2{font-size:22px;margin:12px 0}h3{font-size:17px;margin:12px 0 8px}p{line-height:1.55;margin:8px 0}button,input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--ink);background:var(--card)}input,textarea,select{width:100%}textarea{min-height:75px;resize:vertical}button{cursor:pointer;margin:3px 4px 3px 0;min-height:44px}button.primary,button.active{background:#17365d;color:white}section,article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}small{color:var(--muted)}nav{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}nav button{flex:1;font-size:14px;white-space:nowrap}label{display:block;margin:10px 0 4px}#notice{white-space:pre-wrap;color:var(--warning);margin:6px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.55;margin:6px 0} [hidden]{display:none!important}.warning{background:var(--warn);color:var(--warning)}.check{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);margin:0}.check input{width:20px;height:20px;flex:none;margin:2px 0}.result{display:block;width:100%;text-align:left;border:0;font-weight:700;padding:4px;min-height:36px}.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:5px}.tabs button{margin:0}details{margin:10px 0}summary{cursor:pointer;font-weight:600;padding:8px 0}.search{font-size:17px;padding:15px}.muted{color:var(--muted)}</style></head><body><main><header><strong>현장 업무 매뉴얼 <small>v1.1</small></strong><button id="logout" hidden>로그아웃</button></header><p id="notice" role="status"></p><div id="app">연결 중…</div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,setPersistence,browserSessionPersistence} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
import {initializeFirestore,memoryLocalCache,doc,collection,getDocFromServer,getDocsFromServer,setDoc,addDoc,updateDoc,deleteDoc,serverTimestamp,onSnapshot} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js';
const config={apiKey:'AIzaSyCrH8W59H26q7P0pPlv91FMscvT10h_dkk',authDomain:'police-manual-73975.firebaseapp.com',projectId:'police-manual-73975',storageBucket:'police-manual-73975.firebasestorage.app',messagingSenderId:'302556436811',appId:'1:302556436811:web:e84c7e836a31ef359a30ce'};
const firebase=initializeApp(config),auth=getAuth(firebase),db=initializeFirestore(firebase,{localCache:memoryLocalCache()});await setPersistence(auth,browserSessionPersistence);
const root=document.querySelector('#app'),notice=document.querySelector('#notice'),logout=document.querySelector('#logout');let user,admin=false,approved=false,manuals=[],stops=[],generation=0,favorites=new Set(),recent=[];
function el(tag,text,parent=root){let e=document.createElement(tag);if(text)e.textContent=text;parent.append(e);return e}function btn(text,fn,parent=root){let e=el('button',text,parent);e.onclick=async()=>{notice.textContent='';try{await fn()}catch(err){notice.textContent='처리 실패: '+(err.code||err.message)}};return e}function field(parent,label,multi=false){el('label',label,parent);return el(multi?'textarea':'input','',parent)}function clear(){root.replaceChildren()}function stop(keep=false){stops.forEach(f=>f());stops=[];manuals=[];if(!keep){favorites.clear();recent=[]}admin=approved=false;clear()}logout.onclick=()=>signOut(auth);
function login(){clear();el('h1','현장 업무 매뉴얼');el('p','승인된 경찰서 직원만 이용할 수 있습니다.');btn('Google 계정으로 로그인',()=>signInWithPopup(auth,new GoogleAuthProvider()))}
function pending(status){clear();el('h1',status==='pending'?'승인 대기 중':'이용 권한 없음');el('p','관리자에게 문의해 주세요.');btn('권한 다시 확인',()=>refresh())}
function join(){clear();el('h1','이용 권한 신청');let n=field(root,'성명'),d=field(root,'소속 부서');btn('신청',async()=>{if(!n.value.trim()||!d.value.trim())throw Error('성명과 소속을 입력하세요.');await setDoc(doc(db,'users',user.uid),{name:n.value.trim(),department:d.value.trim(),status:'pending',createdAt:serverTimestamp()});await refresh()});el('small','신청 정보는 관리자 승인 목적으로 사용됩니다. 실제 사건정보는 입력하지 마세요.')}
async function refresh(){let g=++generation;stop(true);if(!user){login();return}el('p','권한 확인 중…');try{let [a,u]=await Promise.all([getDocFromServer(doc(db,'admins',user.uid)),getDocFromServer(doc(db,'users',user.uid))]);if(g!==generation)return;admin=a.exists();approved=u.exists()&&u.data().status==='approved';if(admin||approved){let snap=await getDocsFromServer(collection(db,'manuals'));if(g!==generation)return;manuals=snap.docs.map(d=>({id:d.id,...d.data()}));home()}else {favorites.clear();recent=[];if(u.exists())pending(u.data().status);else join();}for(let [path,initial] of [['admins',a],['users',u]])stops.push(onSnapshot(doc(db,path,user.uid),{includeMetadataChanges:true},s=>{if(g!==generation||s.metadata.fromCache)return;if(s.exists()!==initial.exists()||s.data()?.status!==initial.data()?.status)refresh()},()=>{if(g===generation){stop();el('p','권한 확인 실패. 다시 로그인하세요.')}}));}catch(e){if(g===generation){stop();el('p','서버 연결 또는 권한 확인 실패');btn('다시 시도',refresh);notice.textContent=e.code||e.message}}}
onAuthStateChanged(auth,u=>{favorites.clear();recent=[];user=u;logout.hidden=!u;refresh()});window.addEventListener('offline',()=>{++generation;stop();el('p','인터넷 연결이 필요합니다.')});window.addEventListener('online',refresh);
const norm=s=>String(s||'').normalize('NFC').toLowerCase().replace(/[^가-힣ㄱ-ㅎㅏ-ㅣa-z0-9]/g,'');const initials='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';const cho=s=>norm(s).split('').map(c=>{let x=c.charCodeAt(0)-44032;return x>=0&&x<11172?initials[Math.floor(x/588)]:c}).join('');function dist(a,b){let r=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let t=[i];for(let j=1;j<=b.length;j++)t[j]=Math.min(t[j-1]+1,r[j]+1,r[j-1]+(a[i-1]===b[j-1]?0:1));r=t}return r[b.length]}
function score(m,q){m={...m,keywords:[m.keywords,...(Array.isArray(m.variants)?m.variants.map(v=>v.name):[])].filter(Boolean).join(","),body:[m.body,...(Array.isArray(m.variants)?m.variants.map(v=>Object.values(v).join(" ")):[])].join(" ")};let n=norm(q),title=norm(m.title),keys=String(m.keywords||'').split(/[,\n]/).map(norm).filter(Boolean),words=q.split(/\s+/).map(norm).filter(x=>x.length>=2);if(!n)return 0;let s=title===n?100:title.includes(n)?65:0;if(/^[ㄱ-ㅎ]+$/.test(n)&&cho(m.title).includes(n))s+=55;for(let k of keys){if(k===n)s+=45;else if(k.length>=2&&n.includes(k))s+=18;else if(n.length>=2&&k.includes(n))s+=12}for(let w of words){if(title.includes(w))s+=12;if(norm(m.summary).includes(w))s+=5;if(norm(m.body).includes(w))s+=2}if(n.length>=3&&n.length<=40&&[title,...keys].some(k=>Math.abs(k.length-n.length)<=2&&dist(k,n)<=Math.min(2,Math.floor(n.length/3))))s+=25;return s}
function report(){clear();btn('← 검색',()=>home());let t=field(root,'오류 또는 등록 요청 (개인정보 제외)',true);btn('전송',async()=>{await addDoc(collection(db,'reports'),{uid:user.uid,message:t.value.trim(),createdAt:serverTimestamp()});home();notice.textContent='등록되었습니다.'})}
async function manage(){if(!admin)return;clear();btn('← 검색',()=>home());el('h2','관리자');btn('새 매뉴얼',()=>edit());btn('회원 관리',members);btn('오류신고 확인',reports);for(let m of manuals){let a=el('article');el('strong',m.title,a);btn('수정',()=>edit(m),a);btn('삭제',async()=>{if(confirm('삭제하시겠습니까?')){await deleteDoc(doc(db,'manuals',m.id));await refresh();manage()}},a)}}
async function members(){if(!admin)return;let g=generation;clear();btn('← 관리자',manage);el('h2','회원 관리');let s=await getDocsFromServer(collection(db,'users'));if(g!==generation||!admin)return;for(let d of s.docs){let a=el('article'),u=d.data();el('p',`${u.name} · ${u.department} · ${u.status}`,a);for(let [label,status] of [['승인','approved'],['거절','rejected'],['권한 회수','revoked']])btn(label,async()=>{if(confirm(label+' 처리하시겠습니까?')){await updateDoc(d.ref,{status});members()}},a)}}async function reports(){if(!admin)return;let g=generation;clear();btn('← 관리자',manage);let s=await getDocsFromServer(collection(db,'reports'));if(g!==generation||!admin)return;for(let d of s.docs){let a=el('article');el('p',d.data().message,a);btn('삭제',async()=>{if(confirm('삭제하시겠습니까?')){await deleteDoc(d.ref);reports()}},a)}}

const lines=v=>String(v||'').split(/\n/).map(x=>x.trim()).filter(Boolean);
const sections=[['documents','작성 서류'],['warnings','필수 유의사항'],['requirements','핵심 판단사항'],['checks','판단 체크리스트'],['law','관련 법령'],['steps','현장 조치'],['reference','상세 참고자료']];
function home(mode='search',query=''){if(!admin&&!approved)return;clear();let q=el('input');q.className='search';q.placeholder='업무명 또는 현장 상황 검색';q.setAttribute('aria-label','업무 검색');q.maxLength=150;q.value=query;let nav=el('nav');let out=el('div');let category='';function render(){out.replaceChildren();let list=mode==='fav'?manuals.filter(m=>favorites.has(m.id)):mode==='recent'?recent.map(id=>manuals.find(m=>m.id===id)).filter(Boolean):mode==='all'?manuals.filter(m=>!category||m.category===category):manuals.map(m=>({...m,s:score(m,q.value)})).filter(m=>m.s>=10).sort((a,b)=>b.s-a.s);if(mode==='search'&&!q.value.trim()){el('h3','업무 분야',out);let tabs=el('div','',out);tabs.className='tabs';for(let c of [...new Set(manuals.map(m=>m.category).filter(Boolean))])btn(c,()=>{mode='all';category=c;render()},tabs);if(!manuals.length)el('p','등록된 매뉴얼이 없습니다.',out);return}el('small',`${category&&mode==='all'?category+' · ':''}${list.length}건`,out);if(!list.length)el('p','관련 매뉴얼이 없습니다.',out);function show(n){out.replaceChildren();el('small',`${list.length}건`,out);for(let m of list.slice(0,n)){let a=el('article','',out);el('small',m.category||'업무 매뉴얼',a);btn(m.title,()=>detail(m.id,mode,q.value),a).className='result';if(m.summary)el('p',m.summary,a);if(favorites.has(m.id))el('small','★ 즐겨찾기',a)}if(list.length>n)btn('더 보기',()=>show(n+5),out)}if(list.length)show(5)}for(let [label,value] of [['검색','search'],['즐겨찾기','fav'],['최근 열람','recent'],['전체','all']])btn(label,()=>{mode=value;category='';q.value='';render()},nav);q.oninput=()=>{mode='search';category='';render()};render();let bottom=el('nav');btn('오류·등록 요청',report,bottom);if(admin)btn('관리자',manage,bottom);el('small','실제 사건 개인정보 입력 금지 · 최신 공식 지침 확인 필요');}
async function detail(id,mode='search',query=''){if(!admin&&!approved)return;let g=generation;let snap=await getDocFromServer(doc(db,'manuals',id));if(g!==generation||(!admin&&!approved))return;if(!snap.exists())return home();let m=snap.data();recent=[id,...recent.filter(x=>x!==id)].slice(0,30);clear();btn('← 목록',()=>home(mode,query));el('h2',m.title);el('small',m.category||'');let star=btn(favorites.has(id)?'★ 즐겨찾기 해제':'☆ 즐겨찾기 추가',()=>{favorites.has(id)?favorites.delete(id):favorites.add(id);star.textContent=favorites.has(id)?'★ 즐겨찾기 해제':'☆ 즐겨찾기 추가'});if(m.summary)el('p',m.summary);let variants=Array.isArray(m.variants)?m.variants:[];let tabs=el('div');tabs.className='tabs';let content=el('div');function draw(i){content.replaceChildren();Array.from(tabs.children).forEach((b,j)=>b.className=i===j?'active':'');let v=variants[i];if(v){for(let [k,label] of sections){if(!String(v[k]||'').trim())continue;let a=el('section','',content);if(k==='warnings')a.className='warning';if(['law','reference','steps'].includes(k)){let d=el('details','',a);el('summary',label,d);el('pre',v[k],d)}else{el('h3',label,a);if(k==='documents'||k==='checks'){let inputs=[];for(let t of lines(v[k])){let l=el('label','',a);l.className='check';let c=el('input','',l);c.type='checkbox';inputs.push(c);el('span',t,l)}btn('초기화',()=>inputs.forEach(c=>c.checked=false),a);if(k==='checks')el('small','확인 보조용이며 적법성 자동 판단을 하지 않습니다.',a)}else el('pre',v[k],a)}}}if(m.body){let d=el('details','',content);el('summary','기존 상세 내용',d);el('pre',m.body,d)}if(m.source){let d=el('details','',content);el('summary','출처',d);el('pre',m.source,d)}el('small','최종 수정: '+(m.updatedAt?.toDate?.().toLocaleDateString('ko-KR')||'미등록'),content)}variants.forEach((v,i)=>btn(v.name||'기본',()=>draw(i),tabs));draw(0)}
function edit(m={}){if(!admin)return;clear();btn('← 관리자',manage);el('h2',m.id?'매뉴얼 수정':'새 매뉴얼');let fields={};for(let [k,l,multi] of [['title','업무명'],['category','업무 분야'],['keywords','검색 키워드 (쉼표 구분)',true],['summary','짧은 요약 (선택)',true],['source','공개 출처',true]]){fields[k]=field(root,l,multi);fields[k].value=m[k]||''}let type=el('select');for(let [v,l] of [['A','A형 · 서류 중심'],['B','B형 · 법률 판단'],['C','C형 · 체크리스트']]){let o=el('option',l,type);o.value=v}type.value=m.type||'A';let wrap=el('div');let editors=[];function add(v={}){let a=el('section','',wrap);let f={name:field(a,'세부 업무 유형')};f.name.value=v.name||'기본';for(let [k,l] of sections){let d=el('details','',a);el('summary',l,d);f[k]=field(d,'내용 (서류·체크 항목은 한 줄에 하나)',true);f[k].value=v[k]||'';d.open=Boolean(v[k])||k==='documents'||k==='warnings'||(type.value==='B'&&['law','requirements'].includes(k))||(type.value==='C'&&k==='checks')}let entry={a,f};editors.push(entry);btn('이 유형 삭제',()=>{if(confirm('이 유형을 삭제할까요?')){editors=editors.filter(x=>x!==entry);a.remove()}},a)}for(let v of (m.variants?.length?m.variants:[{}]))add(v);btn('+ 세부 업무 유형 추가',()=>add());let legacy=el('details');el('summary','기존 상세 내용 (선택)',legacy);let body=field(legacy,'상세 내용',true);body.value=m.body||'';btn('저장',async()=>{if(!admin)return;let data=Object.fromEntries(Object.entries(fields).map(([k,v])=>[k,v.value.trim()]));data.body=body.value.trim();data.type=type.value;data.variants=editors.map(({f})=>Object.fromEntries(Object.entries(f).map(([k,v])=>[k,v.value.trim()])));if(!data.title||!data.source)throw Error('업무명과 공개 출처를 입력하세요.');if(!data.variants.length||data.variants.some(v=>!v.name))throw Error('세부 업무 유형 이름을 입력하세요.');data.updatedAt=serverTimestamp();if(m.id)await updateDoc(doc(db,'manuals',m.id),data);else await addDoc(collection(db,'manuals'),data);await refresh();if(admin)manage()}).className='primary'}

if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
